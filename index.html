<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Time Counters</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--blue:#2563eb;--dark:#111827;--soft:#e5e7eb;--dangerbg:#fee2e2;--danger:#b91c1c;--green:#16a34a}
body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#475569;--soft:#334155}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}header{background:var(--dark);color:#fff;padding:18px 16px;position:sticky;top:0}h1{margin:0;font-size:24px}.sub{opacity:.7;font-size:13px}main{max-width:620px;margin:auto;padding:14px}.panel,.card,.total{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0002}.total{background:#dbeafe;color:#111827}.total b{font-size:25px}.add,.plus{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700}.add{width:100%;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:10px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-size:18px;font-weight:700;border:0;outline:0;width:52%;background:transparent;color:var(--text)}.actions{display:flex;gap:6px}.edit{background:var(--soft);color:var(--text)}.del{background:var(--dangerbg);color:var(--danger)}.time{font-size:32px;font-weight:800;margin-top:10px}.target{color:var(--muted);font-size:14px;margin:3px 0 10px}.percent{font-size:20px;font-weight:800}.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 12px}.bar{height:100%;background:var(--blue)}.done{background:var(--green)}.over{background:#dc2626}.targetBox{display:none;background:var(--bg);padding:12px;border-radius:12px;margin:10px 0}.targetBox.open{display:block}.secondary,.reset{background:var(--soft);color:var(--text)}.toolbar{display:flex;gap:8px}.toolbar>*{flex:1}.empty{text-align:center;color:var(--muted);padding:25px}.history-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.small{font-size:12px;color:var(--muted)}
</style></head><body><header><h1>⏱ Time Counters</h1><div class="sub">Track work time and PPT slides</div></header><main>
<div class="panel"><h2>Add a counter</h2><div class="grid"><select id="newType"><option value="time">⏱ Time Counter</option><option value="slides">📊 PPT Slide Counter</option></select><input id="newName" placeholder="Name (optional)"></div><button class="add" onclick="addCounter()">＋ Add Counter</button></div>
<div class="total"><small>Total of all counters</small><br><b id="total">00:00</b><div id="overall">Overall progress: 0.0%</div></div>
<div class="panel"><h2>Settings</h2><div class="toolbar"><button class="secondary" onclick="toggleDark()">🌙 Dark Mode</button><button class="secondary" onclick="notify()">🔔 Notifications</button></div><div class="small" id="ns"></div></div>
<div id="list"></div>
<div class="panel"><h2>History</h2><div class="toolbar"><button class="secondary" onclick="historyView('day')">Today</button><button class="secondary" onclick="historyView('week')">This Week</button><button class="secondary" onclick="clearHistory()">Clear</button></div><div id="hist"></div></div>
</main><script>
let a=JSON.parse(localStorage.getItem("tc3")||"[]"),h=JSON.parse(localStorage.getItem("th3")||"[]");
const save=()=>localStorage.setItem("tc3",JSON.stringify(a)),saveH=()=>localStorage.setItem("th3",JSON.stringify(h));
function fmt(x){x=Math.floor(x);let H=Math.floor(x/3600),M=Math.floor(x%3600/60),S=x%60;return H?`${String(H).padStart(2,"0")}:${String(M).padStart(2,"0")}:${String(S).padStart(2,"0")}`:`${String(M).padStart(2,"0")}:${String(S).padStart(2,"0")}`}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function today(){let d=new Date();return d.toISOString().slice(0,10)}
function addCounter(){let type=newType.value,n=newName.value.trim()||(type==="slides"?"PPT Slides ":"Counter ")+(a.length+1);a.push({n,type,t:0,target:0});newName.value="";save();render()}
function add(i){let c=a[i],v=0;if(c.type==="slides"){v=Math.max(0,+document.getElementById("m"+i).value||0);if(!v)return;c.t+=v;h.push({date:today(),name:c.n,v,type:"slides"})}else{let m=+document.getElementById("m"+i).value||0,s=+document.getElementById("s"+i).value||0;v=m*60+s;if(!v)return;c.t+=v;h.push({date:today(),name:c.n,v,type:"time"})}save();saveH();render();historyView("day");check(i)}
function setTarget(i){let c=a[i];if(c.type==="slides")c.target=Math.max(0,+document.getElementById("tm"+i).value||0);else c.target=(+document.getElementById("tm"+i).value||0)*60+(+document.getElementById("ts"+i).value||0);c.notified=false;save();render()}
function check(i){let c=a[i];if(c.target&&c.t>=c.target&&!c.notified){c.notified=true;save();if("Notification"in window&&Notification.permission==="granted")new Notification("Target reached",{body:c.n})}if(c.t<c.target){c.notified=false;save()}}
function reset(i){a[i].t=0;a[i].notified=false;save();render()}function del(i){a.splice(i,1);save();render()}function rename(i,v){a[i].n=v;save()}function edit(i){document.getElementById("tb"+i).classList.toggle("open")}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("tcTheme",document.body.classList.contains("dark")?"dark":"light")}
function notify(){if("Notification"in window)Notification.requestPermission().then(()=>ns.textContent="Notifications: "+Notification.permission)}
function historyView(mode){let rows=h.filter(x=>mode==="day"?x.date===today():x.date>=new Date(Date.now()-6*864e5).toISOString().slice(0,10)),g={};rows.forEach(x=>{g[x.name]=(g[x.name]||0)+x.v});hist.innerHTML=Object.keys(g).length?Object.entries(g).map(([n,v])=>{let t=rows.find(x=>x.name===n).type;return `<div class="history-row"><span>${esc(n)}</span><b>${t==="slides"?v+" slides":fmt(v)}</b></div>`}).join(""):"<div class='empty'>No additions recorded.</div>"}
function clearHistory(){h=[];saveH();historyView("day")}
function render(){list.innerHTML="";if(!a.length){list.innerHTML="<div class='empty'>No counters yet.</div>";return}a.forEach((c,i)=>{let slide=c.type==="slides",p=c.target?Math.min(100,c.t/c.target*100):0,cl=c.t>=c.target&&c.target?"done":"";list.innerHTML+=`<div class="card"><div class="row"><input class="name" value="${esc(c.n)}" onchange="rename(${i},this.value)"><div class="actions"><button class="edit" onclick="edit(${i})">✏ Edit</button><button class="del" onclick="del(${i})">Delete</button></div></div><div class="time">${slide?c.t+" slides":fmt(c.t)}</div><div class="target">${slide?"📊 PPT Slide Counter":"⏱ Time Counter"} · Target: ${c.target?(slide?c.target+" slides":fmt(c.target)):"Not set"}</div>${c.target?`<div class="percent">${p.toFixed(1)}%</div><div class="progress"><div class="bar ${cl}" style="width:${p}%"></div></div>`:""}<div id="tb${i}" class="targetBox">${slide?`<input id="tm${i}" type="number" min="0" placeholder="Total slides"><button class="plus" onclick="setTarget(${i})">Save Target</button>`:`<div class="grid"><input id="tm${i}" type="number" min="0" placeholder="Target minutes"><input id="ts${i}" type="number" min="0" placeholder="Target seconds"></div><button class="plus" style="margin-top:8px;width:100%" onclick="setTarget(${i})">Save Target</button>`}</div>${slide?`<div class="grid"><input id="m${i}" type="number" min="0" placeholder="Add slides"><button class="plus" onclick="add(${i})">＋ Add Slides</button><button class="reset" onclick="reset(${i})">Reset Slides</button></div>`:`<div class="grid"><input id="m${i}" type="number" min="0" placeholder="Add minutes"><input id="s${i}" type="number" min="0" placeholder="Add seconds"><button class="plus" onclick="add(${i})">＋ Add Time</button><button class="reset" onclick="reset(${i})">Reset Time</button></div>`}</div>`});let tt=a.filter(c=>c.type!=="slides"),ss=a.filter(c=>c.type==="slides"),tm=tt.reduce((x,c)=>x+c.t,0),sm=ss.reduce((x,c)=>x+c.t,0),tgt=tt.reduce((x,c)=>x+c.target,0),sgt=ss.reduce((x,c)=>x+c.target,0);total.textContent=(tm?fmt(tm):"00:00")+(sm?" · "+sm+" slides":"");let vals=(tgt?Math.min(1,tm/tgt):0)+(sgt?Math.min(1,sm/sgt):0),n=(tgt?1:0)+(sgt?1:0);overall.textContent="Overall progress: "+(n?(vals/n*100).toFixed(1):"0.0")+"%"}
if(localStorage.getItem("tcTheme")==="dark")document.body.classList.add("dark");render();historyView("day");ns.textContent="Notifications: "+(("Notification"in window)?Notification.permission:"unsupported");if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
